<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەی ژیوار - Kurdish Exam App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f3f4f6;
            --border: #e5e7eb;
        }

        html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        body {
            direction: rtl;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-title h1 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .logo-title p {
            color: #6b7280;
            font-size: 14px;
        }

        .language-selector {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .lang-btn:hover {
            border-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            min-height: 500px;
        }

        /* Screen: Start */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
        }

        .start-screen h2 {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .start-screen p {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .subject-card {
            padding: 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .subject-card.selected {
            border-color: white;
            background: var(--success);
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
        }

        .settings-group {
            background: var(--light);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: right;
        }

        .settings-group label {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--dark);
        }

        .settings-group select,
        .settings-group input {
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            margin-top: 5px;
            font-family: inherit;
        }

        .settings-group select:focus,
        .settings-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            min-width: 140px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Quiz Screen */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .quiz-info {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--light);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            transition: width 0.3s ease;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: right;
            font-size: 15px;
        }

        .option:hover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .option.selected {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
        }

        .option.correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .option.wrong {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .option-indicator {
            display: inline-block;
            margin-left: 10px;
            font-weight: 700;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
        }

        .result-score {
            font-size: 60px;
            font-weight: 700;
            color: var(--primary);
            margin: 20px 0;
        }

        .result-message {
            font-size: 20px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .result-box {
            padding: 20px;
            border-radius: 12px;
            background: var(--light);
            text-align: center;
        }

        .result-box-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .result-box-label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
        }

        .result-box.correct {
            background: rgba(16, 185, 129, 0.1);
        }

        .result-box.correct .result-box-number {
            color: var(--success);
        }

        .result-box.wrong {
            background: rgba(239, 68, 68, 0.1);
        }

        .result-box.wrong .result-box-number {
            color: var(--danger);
        }

        .result-box.skipped {
            background: rgba(249, 115, 22, 0.1);
        }

        .result-box.skipped .result-box-number {
            color: var(--warning);
        }

        .result-message-detail {
            background: var(--light);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: right;
            line-height: 1.8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .main-content {
                padding: 20px;
            }

            .header {
                padding: 15px;
                flex-direction: column;
                text-align: center;
            }

            .logo-title h1 {
                font-size: 24px;
            }

            .quiz-header {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                min-width: auto;
                padding: 10px 20px;
                font-size: 14px;
            }

            .subject-card {
                padding: 15px;
                font-size: 14px;
            }

            .question-text {
                font-size: 16px;
            }

            .result-score {
                font-size: 48px;
            }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .loader {
            border: 4px solid var(--light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid var(--danger);
            color: var(--danger);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-title">
                <h1>تاقیکردنەوەی ژیوار</h1>
                <p data-i18n="app_description">بەرنامەی تاقیکردنەوەی وزارەتی پێداگۆگی</p>
            </div>
            <div class="language-selector">
                <button class="lang-btn active" data-lang="sorani">کوردی سۆرانی</button>
                <button class="lang-btn" data-lang="badini">کوردی بادینی</button>
                <button class="lang-btn" data-lang="en">English</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Start Screen -->
            <div id="startScreen" class="screen active">
                <div class="start-screen">
                    <h2 data-i18n="welcome">بە خێر بێن</h2>

                    <label style="display: block; text-align: right; margin-bottom: 20px; font-weight: 600;">

                    </label>
                    <div class="subjects-grid" id="subjectsGrid"></div>

                    <div class="settings-group">
                        <label>
                            <span data-i18n="question_count">ژمارەی پرسیارەکان:</span>
                            <input type="number" id="questionCount" min="1" max="20" value="10">
                        </label>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" id="startBtn" disabled data-i18n="start_quiz">دەستپێکردنی تاقیکردنەوە</button>
                    </div>
                </div>
            </div>

            <!-- Quiz Screen -->
            <div id="quizScreen" class="screen">
                <div class="quiz-header">
                    <div class="quiz-info">
                        <div class="info-item">
                            <div class="info-label" data-i18n="question">پرسیار</div>
                            <div class="info-value"><span id="currentQuestion">1</span>/<span id="totalQuestions">10</span></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label" data-i18n="score">نمرە</div>
                            <div class="info-value"><span id="currentScore">0</span></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label" data-i18n="time">کات</div>
                            <div class="info-value" id="timerDisplay">00:00</div>
                        </div>
                    </div>
                    <button class="btn btn-secondary" id="exitBtn" data-i18n="exit">دەرچوون</button>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="question-container">
                    <div class="question-text" id="questionText"></div>
                    <div class="options" id="optionsContainer"></div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-secondary" id="skipBtn" data-i18n="skip">تێپەڕکردن</button>
                    <button class="btn btn-primary" id="nextBtn" disabled data-i18n="next_question">پرسیاری داهاتوو</button>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="resultScreen" class="screen">
                <div class="result-screen">
                    <h2 data-i18n="results">ئەنجامەکانت</h2>
                    <div class="result-score" id="finalScore">10/10</div>
                    <div class="result-message" id="resultMessage"></div>

                    <div class="results-grid">
                        <div class="result-box correct">
                            <div class="result-box-number" id="correctCount">0</div>
                            <div class="result-box-label" data-i18n="correct_answers">وەڵامە راستەکان</div>
                        </div>
                        <div class="result-box wrong">
                            <div class="result-box-number" id="wrongCount">0</div>
                            <div class="result-box-label" data-i18n="wrong_answers">وەڵامە هەڵەکان</div>
                        </div>
                        <div class="result-box skipped">
                            <div class="result-box-number" id="skippedCount">0</div>
                            <div class="result-box-label" data-i18n="skipped">تێپەڕاوەکان</div>
                        </div>
                    </div>

                    <div class="result-message-detail" id="resultDetail"></div>

                    <div class="btn-group">
                        <button class="btn btn-secondary" id="retryBtn" data-i18n="try_again">دیساندا تاقیکردنەوە</button>
                        <button class="btn btn-primary" id="homeBtn" data-i18n="home">بڕۆ ماڵەوە</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

        // Application state
        let currentLanguage = 'sorani';
        let currentSubject = null;
        let currentQuestionIndex = 0;
        let selectedAnswers = {};
        let quizQuestions = [];
        let quizStartTime = 0;
        let quizTimer = null;
        let answers = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', init);

        function init() {
            setupLanguageButtons();
            setupSubjectButtons();
            setupEventListeners();
            updateUI();
        }

        function setupLanguageButtons() {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLanguage = btn.dataset.lang;
                    updateUI();
                });
            });
        }

        function setupSubjectButtons() {
            const grid = document.getElementById('subjectsGrid');
            questionsData.subjects.forEach(subject => {
                const btn = document.createElement('div');
                btn.className = 'subject-card';
                const name = getTranslatedText(subject, 'name');
                btn.textContent = name;
                btn.style.background = subject.color;
                btn.addEventListener('click', () => {
                    currentSubject = subject.id;
                    updateSubjectSelection();
                    updateStartButton();
                });
                grid.appendChild(btn);
            });
        }

        function updateSubjectSelection() {
            document.querySelectorAll('.subject-card').forEach((card, idx) => {
                const isSelected = questionsData.subjects[idx].id === currentSubject;
                card.classList.toggle('selected', isSelected);
            });
        }

        function updateStartButton() {
            const btn = document.getElementById('startBtn');
            btn.disabled = !currentSubject;
        }

        function setupEventListeners() {
            document.getElementById('startBtn').addEventListener('click', startQuiz);
            document.getElementById('exitBtn').addEventListener('click', exitQuiz);
            document.getElementById('skipBtn').addEventListener('click', skipQuestion);
            document.getElementById('nextBtn').addEventListener('click', nextQuestion);
            document.getElementById('retryBtn').addEventListener('click', () => {
                showScreen('startScreen');
                currentSubject = null;
                updateSubjectSelection();
                updateStartButton();
            });
            document.getElementById('homeBtn').addEventListener('click', () => {
                showScreen('startScreen');
                currentSubject = null;
                updateSubjectSelection();
                updateStartButton();
            });
        }

        function getTranslatedText(obj, field) {
            if (currentLanguage === 'en') {
                return obj[field + 'En'] || obj[field + 'Sorani'];
            } else if (currentLanguage === 'badini') {
                return obj[field + 'Badini'] || obj[field + 'Sorani'];
            } else {
                return obj[field + 'Sorani'];
            }
        }

        function getText(key) {
            const str = questionsData.ui_strings[key];
            if (!str) return key;
            if (currentLanguage === 'en') {
                return str.en || str.sorani;
            } else if (currentLanguage === 'badini') {
                return str.badini || str.sorani;
            } else {
                return str.sorani;
            }
        }

        function startQuiz() {
            const count = parseInt(document.getElementById('questionCount').value) || 10;
            const subjectQuestions = questionsData.questions.filter(q => q.subject === currentSubject);
            
            quizQuestions = [];
            for (let i = 0; i < count && subjectQuestions.length > 0; i++) {
                const idx = Math.floor(Math.random() * subjectQuestions.length);
                quizQuestions.push(subjectQuestions[idx]);
                subjectQuestions.splice(idx, 1);
            }

            currentQuestionIndex = 0;
            selectedAnswers = {};
            quizStartTime = Date.now();
            quizTimer = setInterval(updateTimer, 100);
            
            showScreen('quizScreen');
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= quizQuestions.length) {
                finishQuiz();
                return;
            }

            const question = quizQuestions[currentQuestionIndex];
            const text = getTranslatedText(question, 'text');
            
            document.getElementById('questionText').textContent = text;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestions').textContent = quizQuestions.length;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            question.options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = getTranslatedText(option, 'text');
                optionDiv.addEventListener('click', () => selectAnswer(option.id));
                
                if (selectedAnswers[currentQuestionIndex] === option.id) {
                    optionDiv.classList.add('selected');
                }
                
                container.appendChild(optionDiv);
            });

            updateProgress();
            updateScore();
            document.getElementById('nextBtn').disabled = !selectedAnswers[currentQuestionIndex];
        }

        function selectAnswer(optionId) {
            selectedAnswers[currentQuestionIndex] = optionId;
            document.querySelectorAll('.option').forEach((opt, idx) => {
                const qoptions = quizQuestions[currentQuestionIndex].options;
                opt.classList.toggle('selected', qoptions[idx]?.id === optionId);
            });
            document.getElementById('nextBtn').disabled = false;
        }

        function skipQuestion() {
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - quizStartTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            document.getElementById('timerDisplay').textContent = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function updateScore() {
            let score = 0;
            Object.entries(selectedAnswers).forEach(([idx, answer]) => {
                if (quizQuestions[idx] && answer === quizQuestions[idx].correctAnswer) {
                    score++;
                }
            });
            document.getElementById('currentScore').textContent = score;
        }

        function finishQuiz() {
            clearInterval(quizTimer);
            
            let correct = 0, wrong = 0, skipped = 0;
            let resultDetail = '';
            
            quizQuestions.forEach((question, idx) => {
                if (!selectedAnswers[idx]) {
                    skipped++;
                } else if (selectedAnswers[idx] === question.correctAnswer) {
                    correct++;
                } else {
                    wrong++;
                }
            });

            const percentage = Math.round((correct / quizQuestions.length) * 100);
            let message = '';
            if (percentage >= 80) {
                message = 'بێجگە! تۆ بووی بێ مام!';
            } else if (percentage >= 60) {
                message = 'باش بوو!';
            } else if (percentage >= 40) {
                message = 'کاتێ هتد خولقان بکەیت!';
            } else {
                message = 'دیساندا تاقیکردنەوە کردن پێویستە!';
            }

            document.getElementById('finalScore').textContent = `${correct}/${quizQuestions.length}`;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('resultDetail').textContent = 
                `فیزدانا (${percentage}%) - ${getTotalTime()}`;

            showScreen('resultScreen');
        }

        function getTotalTime() {
            const elapsed = Math.floor((Date.now() - quizStartTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            return `${mins} خولەم ${secs} چرکە`;
        }

        function exitQuiz() {
            if (confirm('دەتەوێت لە تاقیکردنەوە دەرچیت؟')) {
                clearInterval(quizTimer);
                showScreen('startScreen');
                currentSubject = null;
                updateSubjectSelection();
                updateStartButton();
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function updateUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                el.textContent = getText(key);
            });
        }
    </script>
